<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Routine — Nov–Dec 2026 Planner</title>

  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            obsidian: '#0B0D12',
            midnight: '#141821',
            midnightElevated: '#1A202C',
            borderGlow: '#222836',
            limePulse: '#D7FF00',
            solarAmber: '#FF9F1C',
            twilightViolet: '#8B5CF6',
            twilightCyan: '#38BDF8',
          },
          boxShadow: {
            'row-obsidian': '0 6px 20px -4px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(34, 40, 54, 0.95)',
            'row-start': '0 8px 26px -4px rgba(215, 255, 0, 0.14), 0 0 0 1.5px #D7FF00',
            'lime-glow': '0 0 20px rgba(215, 255, 0, 0.25)',
          }
        }
      }
    };
  </script>

  <style>
    /* Custom sleek scrollbars for horizontal/vertical task zones */
    .slot-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .slot-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .slot-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, 0.22);
      border-radius: 9999px;
    }
    .slot-scroll::-webkit-scrollbar-thumb:hover {
      background-color: rgba(215, 255, 0, 0.55);
    }

    /* Horizontal slide transitions when switching weeks */
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(28px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-28px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .slide-next {
      animation: slideInRight 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .slide-prev {
      animation: slideInLeft 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Smooth entry animation for newly added tasks */
    @keyframes taskFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .task-animate {
      animation: taskFadeIn 0.16s ease-out forwards;
    }

    /* Subtle radial ambient glow in background */
    .ambient-canvas {
      background-color: #0B0D12;
      background-image:
        radial-gradient(circle at 18% 0%, rgba(255, 159, 28, 0.06) 0%, transparent 38%),
        radial-gradient(circle at 82% 0%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(215, 255, 0, 0.03) 0%, transparent 45%);
    }
  </style>
</head>
<body class="font-sans ambient-canvas text-slate-100 min-h-screen lg:h-screen lg:overflow-hidden flex flex-col select-none">

  <!-- Top Compact Header with 7-Week Slider Controls -->
  <header class="w-full shrink-0 px-4 sm:px-6 pt-3 pb-2.5 border-b border-[#222836] bg-[#0B0D12]/90 backdrop-blur-md z-20">
    <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand & Strict Date Range Badge -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-[#D7FF00] text-[#0B0D12] flex items-center justify-center shadow-lime-glow font-bold">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <path d="M9 16l2 2 4-4"></path>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-semibold tracking-tight text-white leading-tight">Weekly Routine</h1>
            <span class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#D7FF00]/12 text-[#D7FF00] border border-[#D7FF00]/30">
              <span class="w-1.5 h-1.5 rounded-full bg-[#D7FF00] animate-pulse"></span>
              <span>Nov 16 – Dec 31, 2026</span>
            </span>
          </div>
          <p class="text-[11px] text-slate-400 hidden md:block">One row per day • Left: Solar Morning • Right: Twilight Night</p>
        </div>
      </div>

      <!-- Center 7-Week Slider Navigator -->
      <div class="flex items-center gap-2 order-3 lg:order-2 w-full lg:w-auto justify-between lg:justify-center bg-[#141821] border border-[#222836] rounded-2xl px-2 py-1.5 shadow-inner">
        <!-- Previous Week Button -->
        <button
          id="prevWeekBtn"
          type="button"
          title="Previous Week (Left Arrow)"
          aria-label="Previous Week"
          class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-200 bg-[#1A202C] hover:bg-[#D7FF00] hover:text-[#0B0D12] border border-[#222836] transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <!-- Active Week Info & 7 Clickable Week Progress Pills -->
        <div class="flex flex-col items-center px-2 sm:px-4 min-w-[210px] sm:min-w-[260px]">
          <div class="flex items-center gap-2">
            <span id="weekRangeLabel" class="text-xs sm:text-sm font-semibold text-white tracking-tight">Nov 16 – Nov 22, 2026</span>
            <span id="weekCounterBadge" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-[#222836] text-[#D7FF00]">
              W1 / 7
            </span>
          </div>
          <!-- 7 Clickable Week Progress Pills -->
          <div id="weekTrackPills" class="flex items-center gap-1.5 mt-1.5" role="tablist" aria-label="Select week">
            <!-- Populated dynamically via JS -->
          </div>
        </div>

        <!-- Next Week Button -->
        <button
          id="nextWeekBtn"
          type="button"
          title="Next Week (Right Arrow)"
          aria-label="Next Week"
          class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-200 bg-[#1A202C] hover:bg-[#D7FF00] hover:text-[#0B0D12] border border-[#222836] transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Right Controls: Start (Nov 16) Quick Jump, Week Progress, Clear Completed -->
      <div class="flex items-center gap-2 order-2 lg:order-3">
        <!-- Quick Jump to Start (Nov 16) Button -->
        <button
          id="jumpStartBtn"
          type="button"
          class="hidden items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-[#D7FF00] text-[#0B0D12] hover:bg-[#e3ff47] shadow-lime-glow transition-all active:scale-95"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Start (Nov 16)</span>
        </button>

        <!-- Active Week Task Counter -->
        <div class="hidden xl:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#141821] border border-[#222836] text-xs font-medium text-slate-300">
          <span>Week Done:</span>
          <span id="progressCounter" class="font-bold text-[#D7FF00]">0 / 0</span>
        </div>

        <!-- Clear Completed Button -->
        <button
          id="clearCompletedBtn"
          type="button"
          title="Remove completed tasks in this week"
          class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium bg-[#141821] text-slate-300 border border-[#222836] hover:border-rose-500/60 hover:text-rose-400 transition-all active:scale-95 disabled:opacity-35 disabled:pointer-events-none"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
          <span>Clear Completed</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Desktop Column Legend Strip (Day | Left Half: Morning | Right Half: Night) -->
  <div class="hidden md:block w-full max-w-[1600px] mx-auto px-4 sm:px-6 pt-2.5 shrink-0">
    <div class="grid grid-cols-[132px_1fr_1fr] items-center px-3 py-1.5 rounded-xl bg-[#141821]/85 border border-[#222836] text-[11px] font-bold uppercase tracking-wider">
      <div class="text-slate-400">Day</div>
      <div class="flex items-center gap-1.5 text-[#FF9F1C] pl-3 border-l border-[#222836]">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <span>Morning (Left Half)</span>
      </div>
      <div class="flex items-center gap-1.5 text-[#A78BFA] pl-3 border-l border-[#222836]">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span>Night (Right Half)</span>
      </div>
    </div>
  </div>

  <!-- Main Stacked Horizontal Day Rows Viewport (Swipeable) -->
  <main id="swipeViewport" class="flex-1 w-full max-w-[1600px] mx-auto px-4 sm:px-6 py-2.5 lg:py-3 lg:min-h-0 flex flex-col overflow-x-hidden">
    <div
      id="weekRowsContainer"
      class="flex flex-col gap-2.5 lg:gap-2 flex-1 lg:min-h-0"
    >
      <!-- One horizontal row per day rendered dynamically by JS -->
    </div>
  </main>

  <!-- Non-blocking Toast Notification -->
  <div
    id="toastContainer"
    class="fixed bottom-4 right-4 z-50 pointer-events-none flex flex-col gap-2"
  ></div>

  <script>
    /**
     * Weekly Routine — Nov 16 to Dec 31, 2026 Horizontal Split-Row Planner
     * Strictly excludes all days before Monday, Nov 16, 2026 and after Thursday, Dec 31, 2026.
     * Each day renders as one horizontal row: Left Day Label | Left Half Morning | Right Half Night.
     */
    (function () {
      const STORAGE_KEYS = {
        TASKS: 'weekly_routine_split_nov16_dec31_2026_v1',
        INITIALIZED: 'weekly_routine_split_nov16_dec31_2026_init_v1'
      };

      const START_DATE_ISO = '2026-11-16'; // Tomorrow, Monday, November 16, 2026
      const END_DATE_ISO = '2026-12-31';   // Thursday, December 31, 2026

      const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const DAY_NAMES_BY_JS_DAY = [
        { full: 'Sunday', short: 'SUN' },
        { full: 'Monday', short: 'MON' },
        { full: 'Tuesday', short: 'TUE' },
        { full: 'Wednesday', short: 'WED' },
        { full: 'Thursday', short: 'THU' },
        { full: 'Friday', short: 'FRI' },
        { full: 'Saturday', short: 'SAT' }
      ];

      /**
       * Parse YYYY-MM-DD safely into a local Date at noon (avoids DST shifts)
       */
      function parseISO(isoStr) {
        const [y, m, d] = isoStr.split('-').map(Number);
        return new Date(y, m - 1, d, 12, 0, 0);
      }

      /**
       * Format Date object to YYYY-MM-DD
       */
      function formatISO(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      /**
       * Format Date object to "Nov 16"
       */
      function formatShortDate(dateObj) {
        return `${MONTH_NAMES[dateObj.getMonth()]} ${dateObj.getDate()}`;
      }

      /**
       * Build the exact 7 slideable weeks from Monday, Nov 16, 2026 to Thursday, Dec 31, 2026
       * Week 7 strictly contains the 4 remaining days (Mon Dec 28 – Thu Dec 31, 2026).
       */
      function generateStrictWeeks() {
        const weeks = [];
        let cursor = parseISO(START_DATE_ISO);
        const endDate = parseISO(END_DATE_ISO);

        let weekIndex = 0;
        while (cursor <= endDate) {
          const days = [];
          for (let i = 0; i < 7; i++) {
            const d = new Date(cursor);
            d.setDate(cursor.getDate() + i);
            if (d > endDate) break;

            const iso = formatISO(d);
            const dayMeta = DAY_NAMES_BY_JS_DAY[d.getDay()];
            days.push({
              iso,
              dayName: dayMeta.full,
              dayShort: dayMeta.short,
              dateLabel: formatShortDate(d),
              isStartDay: iso === START_DATE_ISO
            });
          }

          const firstDay = days[0];
          const lastDay = days[days.length - 1];
          const rangeLabel = `${firstDay.dateLabel} – ${lastDay.dateLabel}, 2026`;

          weeks.push({
            index: weekIndex,
            days,
            rangeLabel
          });

          cursor.setDate(cursor.getDate() + 7);
          weekIndex++;
        }

        return weeks;
      }

      const WEEKS = generateStrictWeeks();

      // Application State
      let currentWeekIndex = 0; // Starts on Week 1 (Nov 16 – Nov 22, 2026)
      let slideDirection = null; // 'next' | 'prev' | null
      let tasks = [];
      let lastClearedBackup = null;

      // DOM References
      const weekRowsContainer = document.getElementById('weekRowsContainer');
      const swipeViewport = document.getElementById('swipeViewport');
      const weekRangeLabel = document.getElementById('weekRangeLabel');
      const weekCounterBadge = document.getElementById('weekCounterBadge');
      const weekTrackPills = document.getElementById('weekTrackPills');
      const prevWeekBtn = document.getElementById('prevWeekBtn');
      const nextWeekBtn = document.getElementById('nextWeekBtn');
      const jumpStartBtn = document.getElementById('jumpStartBtn');
      const progressCounter = document.getElementById('progressCounter');
      const clearCompletedBtn = document.getElementById('clearCompletedBtn');
      const toastContainer = document.getElementById('toastContainer');

      function generateId() {
        return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
      }

      /**
       * Load tasks from localStorage; seed 2 starter items on Monday, Nov 16 on first load only
       */
      function loadTasks() {
        try {
          const isInitialized = localStorage.getItem(STORAGE_KEYS.INITIALIZED);
          const rawTasks = localStorage.getItem(STORAGE_KEYS.TASKS);

          if (!isInitialized) {
            tasks = [
              {
                id: generateId(),
                date: START_DATE_ISO,
                period: 'morning',
                text: 'Morning workout & prioritize weekly goals',
                completed: false
              },
              {
                id: generateId(),
                date: START_DATE_ISO,
                period: 'night',
                text: 'Review tomorrow’s plan & wind down by 11 PM',
                completed: false
              }
            ];
            localStorage.setItem(STORAGE_KEYS.INITIALIZED, 'true');
            saveTasks();
          } else {
            const parsed = rawTasks ? JSON.parse(rawTasks) : [];
            // Ensure no out-of-range dates exist
            tasks = parsed.filter(t => t.date >= START_DATE_ISO && t.date <= END_DATE_ISO);
          }
        } catch (err) {
          console.error('Error loading tasks:', err);
          tasks = [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEYS.TASKS, JSON.stringify(tasks));
        } catch (err) {
          console.error('Error saving tasks:', err);
        }
      }

      /**
       * Slide to target week index with horizontal animation
       */
      function goToWeek(targetIndex) {
        if (targetIndex < 0 || targetIndex >= WEEKS.length || targetIndex === currentWeekIndex) return;
        slideDirection = targetIndex > currentWeekIndex ? 'next' : 'prev';
        currentWeekIndex = targetIndex;
        renderAll();
      }

      function addTask(dateISO, period, rawText) {
        const text = rawText.trim();
        if (!text) return;

        tasks.push({
          id: generateId(),
          date: dateISO,
          period,
          text,
          completed: false
        });

        slideDirection = null;
        saveTasks();
        renderAll();
      }

      function toggleTask(taskId) {
        const target = tasks.find(t => t.id === taskId);
        if (!target) return;
        target.completed = !target.completed;
        slideDirection = null;
        saveTasks();
        renderAll();
      }

      function deleteTask(taskId) {
        tasks = tasks.filter(t => t.id !== taskId);
        slideDirection = null;
        saveTasks();
        renderAll();
      }

      /**
       * Clear completed tasks for the currently active week
       */
      function clearCompletedInCurrentWeek() {
        const activeWeekDates = new Set(WEEKS[currentWeekIndex].days.map(d => d.iso));
        const completedInWeek = tasks.filter(t => activeWeekDates.has(t.date) && t.completed);
        if (completedInWeek.length === 0) return;

        lastClearedBackup = [...tasks];
        tasks = tasks.filter(t => !(activeWeekDates.has(t.date) && t.completed));
        slideDirection = null;
        saveTasks();
        renderAll();

        showToast(`Cleared ${completedInWeek.length} completed task${completedInWeek.length > 1 ? 's' : ''}`, true);
      }

      function undoClearCompleted() {
        if (!lastClearedBackup) return;
        tasks = lastClearedBackup;
        lastClearedBackup = null;
        slideDirection = null;
        saveTasks();
        renderAll();
      }

      function showToast(message, canUndo = false) {
        toastContainer.innerHTML = '';

        const toast = document.createElement('div');
        toast.className = 'pointer-events-auto flex items-center gap-3 px-4 py-2.5 rounded-xl bg-[#1A202C] text-white text-xs font-medium shadow-xl border border-[#222836] task-animate';

        const msgSpan = document.createElement('span');
        msgSpan.textContent = message;
        toast.appendChild(msgSpan);

        if (canUndo) {
          const undoBtn = document.createElement('button');
          undoBtn.type = 'button';
          undoBtn.textContent = 'Undo';
          undoBtn.className = 'px-2.5 py-1 rounded-lg bg-[#D7FF00] hover:bg-[#e3ff47] text-[#0B0D12] font-bold transition-colors';
          undoBtn.addEventListener('click', () => {
            undoClearCompleted();
            toast.remove();
          });
          toast.appendChild(undoBtn);
        }

        toastContainer.appendChild(toast);

        setTimeout(() => {
          if (toast.parentNode) toast.remove();
        }, 4500);
      }

      /**
       * Render 7 clickable week progress pills inside the header week slider
       */
      function renderWeekTrackPills() {
        weekTrackPills.innerHTML = '';

        WEEKS.forEach((week, idx) => {
          const isCurrent = idx === currentWeekIndex;
          const isStartWeek = idx === 0;

          const pill = document.createElement('button');
          pill.type = 'button';
          pill.title = `Week ${idx + 1}: ${week.rangeLabel}${isStartWeek ? ' (Start)' : ''}`;
          pill.setAttribute('aria-label', `Jump to Week ${idx + 1}: ${week.rangeLabel}`);

          if (isCurrent) {
            pill.className = 'h-2 w-7 rounded-full bg-[#D7FF00] shadow-[0_0_10px_rgba(215,255,0,0.6)] transition-all duration-200';
          } else if (isStartWeek) {
            pill.className = 'h-2 w-3 rounded-full bg-[#D7FF00]/45 hover:bg-[#D7FF00] transition-all duration-200';
          } else {
            pill.className = 'h-2 w-2.5 rounded-full bg-[#222836] hover:bg-slate-500 transition-all duration-200';
          }

          pill.addEventListener('click', () => goToWeek(idx));
          weekTrackPills.appendChild(pill);
        });
      }

      /**
       * Build either the Left Half (Morning) or Right Half (Night) cell inside a Day Row
       */
      function createHalfZone(dayObj, period) {
        const isMorning = period === 'morning';
        const slotTasks = tasks.filter(t => t.date === dayObj.iso && t.period === period);

        const zone = document.createElement('div');
        zone.className = [
          'flex flex-col justify-between gap-1.5 px-3 py-2 min-w-0 lg:min-h-0 transition-colors',
          isMorning
            ? 'bg-gradient-to-r from-[#FF9F1C]/[0.05] to-transparent border-b md:border-b-0 md:border-l border-[#222836]'
            : 'bg-gradient-to-r from-[#8B5CF6]/[0.06] to-transparent md:border-l border-[#222836]'
        ].join(' ');

        // Mobile-only Period Subheader (hidden on md+ where top legend bar is visible)
        const mobileSubHeader = document.createElement('div');
        mobileSubHeader.className = 'flex md:hidden items-center justify-between';
        if (isMorning) {
          mobileSubHeader.innerHTML = `
            <span class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-[#FF9F1C]">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
              </svg>
              <span>Morning</span>
            </span>
            <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-[#FF9F1C]/15 text-[#FF9F1C]">${slotTasks.length}</span>
          `;
        } else {
          mobileSubHeader.innerHTML = `
            <span class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-[#A78BFA]">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <span>Night</span>
            </span>
            <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-[#8B5CF6]/15 text-[#C4B5FD]">${slotTasks.length}</span>
          `;
        }
        zone.appendChild(mobileSubHeader);

        // Task Pills / Chips Container (scrollable if many tasks are added)
        const taskList = document.createElement('div');
        taskList.className = 'flex-1 flex flex-wrap items-center content-start gap-1.5 overflow-y-auto slot-scroll pr-0.5 min-h-[28px]';

        if (slotTasks.length === 0) {
          const placeholder = document.createElement('span');
          placeholder.className = 'text-[11px] text-slate-600 italic py-0.5';
          placeholder.textContent = isMorning ? 'No morning tasks' : 'No night tasks';
          taskList.appendChild(placeholder);
        } else {
          slotTasks.forEach(task => {
            const chip = document.createElement('div');
            chip.className = [
              'group inline-flex items-center gap-1.5 max-w-full px-2.5 py-1 rounded-xl border text-xs transition-all cursor-pointer task-animate',
              task.completed
                ? 'bg-[#0B0D12]/65 border-[#1C212E] opacity-60'
                : isMorning
                  ? 'bg-[#1A202C] border-[#293244] hover:border-[#FF9F1C]/70'
                  : 'bg-[#1A202C] border-[#293244] hover:border-[#8B5CF6]/70'
            ].join(' ');

            // Check Toggle Circle/Square
            const checkBox = document.createElement('span');
            checkBox.className = [
              'w-3.5 h-3.5 rounded shrink-0 flex items-center justify-center border transition-colors',
              task.completed
                ? 'bg-[#D7FF00] border-[#D7FF00] text-[#0B0D12]'
                : isMorning
                  ? 'border-slate-500 group-hover:border-[#FF9F1C]'
                  : 'border-slate-500 group-hover:border-[#8B5CF6]'
            ].join(' ');

            if (task.completed) {
              checkBox.innerHTML = `
                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              `;
            }

            // Task Label
            const textSpan = document.createElement('span');
            textSpan.textContent = task.text;
            textSpan.className = 'truncate max-w-[230px] sm:max-w-[280px] lg:max-w-[250px] xl:max-w-[330px] leading-tight ' +
              (task.completed ? 'line-through text-slate-500' : 'text-slate-100 font-medium');
            textSpan.title = task.text;

            // Delete Button
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.title = 'Delete task';
            delBtn.setAttribute('aria-label', 'Delete task');
            delBtn.className = 'shrink-0 w-4 h-4 rounded-md flex items-center justify-center text-slate-500 hover:text-rose-400 hover:bg-rose-500/15 transition-colors ml-0.5';
            delBtn.innerHTML = `
              <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            `;
            delBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              deleteTask(task.id);
            });

            chip.addEventListener('click', () => toggleTask(task.id));

            chip.appendChild(checkBox);
            chip.appendChild(textSpan);
            chip.appendChild(delBtn);
            taskList.appendChild(chip);
          });
        }

        zone.appendChild(taskList);

        // Compact Inline Quick-Add Input Bar
        const form = document.createElement('form');
        form.className = 'flex items-center gap-1.5 shrink-0';

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = isMorning ? '+ Add morning task...' : '+ Add night task...';
        input.setAttribute('aria-label', `Add ${period} task for ${dayObj.dayName} ${dayObj.dateLabel}`);
        input.className = [
          'w-full min-w-0 px-2.5 py-1 rounded-lg text-[11px] bg-[#0B0D12]/85 text-slate-100 placeholder-slate-500 border border-[#222836] focus:outline-none transition-colors',
          isMorning ? 'focus:border-[#FF9F1C]' : 'focus:border-[#8B5CF6]'
        ].join(' ');

        const addBtn = document.createElement('button');
        addBtn.type = 'submit';
        addBtn.title = `Add ${period} task`;
        addBtn.setAttribute('aria-label', `Add ${period} task`);
        addBtn.className = [
          'shrink-0 w-6 h-6 rounded-lg flex items-center justify-center transition-all active:scale-95',
          isMorning
            ? 'bg-[#FF9F1C]/15 text-[#FF9F1C] hover:bg-[#FF9F1C] hover:text-[#0B0D12]'
            : 'bg-[#8B5CF6]/20 text-[#C4B5FD] hover:bg-[#8B5CF6] hover:text-white'
        ].join(' ');
        addBtn.innerHTML = `
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        `;

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (input.value.trim()) {
            addTask(dayObj.iso, period, input.value);
          }
        });

        form.appendChild(input);
        form.appendChild(addBtn);
        zone.appendChild(form);

        return zone;
      }

      /**
       * Render active week header, slider controls, and stacked horizontal day rows
       */
      function renderAll() {
        const activeWeek = WEEKS[currentWeekIndex];

        // Update Week Slider UI
        weekRangeLabel.textContent = activeWeek.rangeLabel;
        weekCounterBadge.textContent = `W${currentWeekIndex + 1} / ${WEEKS.length}`;
        prevWeekBtn.disabled = currentWeekIndex === 0;
        nextWeekBtn.disabled = currentWeekIndex === WEEKS.length - 1;

        // Show "Start (Nov 16)" jump button when viewing Week 2 or later
        if (currentWeekIndex > 0) {
          jumpStartBtn.classList.remove('hidden');
          jumpStartBtn.classList.add('inline-flex');
        } else {
          jumpStartBtn.classList.add('hidden');
          jumpStartBtn.classList.remove('inline-flex');
        }

        renderWeekTrackPills();

        // Update active week task stats
        const activeWeekDates = new Set(activeWeek.days.map(d => d.iso));
        const weekTasks = tasks.filter(t => activeWeekDates.has(t.date));
        const weekDone = weekTasks.filter(t => t.completed).length;

        progressCounter.textContent = `${weekDone} / ${weekTasks.length}`;
        clearCompletedBtn.disabled = weekDone === 0;

        // Apply slide direction animation on weekRowsContainer
        weekRowsContainer.classList.remove('slide-next', 'slide-prev');
        if (slideDirection === 'next') {
          void weekRowsContainer.offsetWidth;
          weekRowsContainer.classList.add('slide-next');
        } else if (slideDirection === 'prev') {
          void weekRowsContainer.offsetWidth;
          weekRowsContainer.classList.add('slide-prev');
        }

        // Render One Horizontal Row Per Day
        weekRowsContainer.innerHTML = '';

        activeWeek.days.forEach(dayObj => {
          const dayTasksCount = tasks.filter(t => t.date === dayObj.iso).length;

          const row = document.createElement('section');
          row.className = [
            'grid grid-cols-1 md:grid-cols-[132px_1fr_1fr] rounded-2xl bg-[#141821] overflow-hidden transition-all lg:flex-1 lg:min-h-0',
            dayObj.isStartDay ? 'shadow-row-start' : 'shadow-row-obsidian'
          ].join(' ');

          // Left Day Info Cell (~132px on desktop)
          const dayCell = document.createElement('div');
          dayCell.className = [
            'px-3.5 py-2.5 flex md:flex-col items-center md:items-start justify-between md:justify-center gap-1 shrink-0 border-b md:border-b-0',
            dayObj.isStartDay
              ? 'bg-[#D7FF00] text-[#0B0D12] border-[#D7FF00]'
              : 'bg-[#191F2B] text-slate-100 border-[#222836]'
          ].join(' ');

          const dayTopWrap = document.createElement('div');
          dayTopWrap.className = 'flex md:flex-col items-baseline md:items-start gap-2 md:gap-0.5';

          const dayShortEl = document.createElement('h2');
          dayShortEl.className = 'text-sm font-extrabold tracking-wide leading-none';
          dayShortEl.textContent = dayObj.dayShort;

          const dateLabelEl = document.createElement('span');
          dateLabelEl.className = dayObj.isStartDay
            ? 'text-xs font-semibold text-[#0B0D12]/85'
            : 'text-xs font-medium text-slate-400';
          dateLabelEl.textContent = dayObj.dateLabel;

          dayTopWrap.appendChild(dayShortEl);
          dayTopWrap.appendChild(dateLabelEl);
          dayCell.appendChild(dayTopWrap);

          // Badge (TOMORROW / START for Nov 16, or Task Count pill for other days)
          if (dayObj.isStartDay) {
            const startBadge = document.createElement('span');
            startBadge.className = 'mt-0 md:mt-1 px-2 py-0.5 rounded-full text-[9px] font-extrabold uppercase tracking-wider bg-[#0B0D12] text-[#D7FF00]';
            startBadge.textContent = 'Tomorrow • Start';
            dayCell.appendChild(startBadge);
          } else {
            const countBadge = document.createElement('span');
            countBadge.className = 'mt-0 md:mt-1 px-2 py-0.5 rounded-md text-[10px] font-semibold bg-[#0B0D12]/70 text-slate-400';
            countBadge.textContent = dayTasksCount === 1 ? '1 task' : `${dayTasksCount} tasks`;
            dayCell.appendChild(countBadge);
          }

          row.appendChild(dayCell);

          // Left Half: Morning
          row.appendChild(createHalfZone(dayObj, 'morning'));

          // Right Half: Night
          row.appendChild(createHalfZone(dayObj, 'night'));

          weekRowsContainer.appendChild(row);
        });
      }

      // Button Event Listeners
      prevWeekBtn.addEventListener('click', () => goToWeek(currentWeekIndex - 1));
      nextWeekBtn.addEventListener('click', () => goToWeek(currentWeekIndex + 1));
      jumpStartBtn.addEventListener('click', () => goToWeek(0));
      clearCompletedBtn.addEventListener('click', clearCompletedInCurrentWeek);

      // Keyboard Left/Right Arrow Navigation (ignored while typing inside an input)
      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea') return;

        if (e.key === 'ArrowLeft') {
          goToWeek(currentWeekIndex - 1);
        } else if (e.key === 'ArrowRight') {
          goToWeek(currentWeekIndex + 1);
        }
      });

      // Touch Horizontal Swipe Support for sliding between weeks
      let touchStartX = 0;
      let touchStartY = 0;

      swipeViewport.addEventListener('touchstart', (e) => {
        if (e.changedTouches && e.changedTouches.length > 0) {
          touchStartX = e.changedTouches[0].screenX;
          touchStartY = e.changedTouches[0].screenY;
        }
      }, { passive: true });

      swipeViewport.addEventListener('touchend', (e) => {
        if (!e.changedTouches || e.changedTouches.length === 0) return;
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;

        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) {
            goToWeek(currentWeekIndex + 1);
          } else {
            goToWeek(currentWeekIndex - 1);
          }
        }
      }, { passive: true });

      // Boot Application
      loadTasks();
      renderAll();
    })();
  </script>
</body>
</html>
